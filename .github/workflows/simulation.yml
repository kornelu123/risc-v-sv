name: Simulation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # riscv-tests/env is needed by priv-tests

      - name: Install Verilator and RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make g++ verilator gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu
          verilator --version
          riscv64-linux-gnu-gcc --version | head -n 1

      - name: Lint
        run: make lint

      - name: Simulate test/test.S
        run: make simulate

      - name: Run riscv-tests (rv32ui, rv32um, rv32ua, test/isa)
        run: make riscv-tests

      - name: Run machine-mode tests (rv32mi, test/priv)
        run: make priv-tests

      - name: Run both suites with other cache shapes (direct-mapped, 4-way, tiny)
        run: make cache-configs

      - name: ULX3S drivers (SDRAM, SD card) tests and lint
        run: make -C ulx3s test lint

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build/isa/**/*.log
            build/isa-p/**/*.log
            build/test/priv/*.log
            build/test/isa/*.log
            build/cfg-*/isa/**/*.log
            build/cfg-*/isa-p/**/*.log
            build/cfg-*/test/priv/*.log
            build/cfg-*/test/isa/*.log
          if-no-files-found: ignore
